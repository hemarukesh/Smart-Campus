<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Campus | Resources</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        rel="stylesheet"
        href="../css/style.css">

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold"
           href="../index.html">

            🌱 Smart Campus

        </a>


        <div class="d-flex align-items-center">

            <button
                class="btn btn-outline-secondary me-3"
                id="themeToggle">

                <i class="bi bi-moon"></i>

            </button>


            <span class="fw-semibold">

                Hema 👋

            </span>

        </div>

    </div>

</nav>



<!-- PAGE -->

<div class="container-fluid">

    <div class="row">


        <!-- SIDEBAR -->

        <aside class="col-md-3 col-lg-2 sidebar p-3">

            <h6 class="text-uppercase text-muted">
                Menu
            </h6>


            <ul class="nav flex-column">


                <li class="nav-item">

                    <a class="nav-link"
                       href="../index.html">

                        <i class="bi bi-grid"></i>

                        Dashboard

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       href="tasks.html">

                        <i class="bi bi-check2-square"></i>

                        Tasks

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       href="notes.html">

                        <i class="bi bi-journal-text"></i>

                        Notes

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       href="schedule.html">

                        <i class="bi bi-calendar3"></i>

                        Schedule

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       href="timer.html">

                        <i class="bi bi-stopwatch"></i>

                        Study Timer

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link active"
                       href="resources.html">

                        <i class="bi bi-book"></i>

                        Resources

                    </a>

                </li>

            </ul>

        </aside>



        <!-- MAIN -->

        <main class="col-md-9 col-lg-10 p-4">


            <!-- HEADER -->

            <div class="mb-4">

                <h2>
                    🔗 Resource Hub
                </h2>

                <p class="text-muted">

                    Explore useful resources for learning
                    and placement preparation.

                </p>

            </div>



            <!-- SEARCH -->

            <div class="card mb-4">

                <div class="card-body">

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-search"></i>

                        </span>


                        <input
                            type="text"
                            id="resourceSearch"
                            class="form-control"
                            placeholder="Search resources...">

                    </div>

                </div>

            </div>



            <!-- CATEGORY FILTER -->

            <div class="mb-4">

                <button
                    class="btn btn-primary me-2 mb-2 category-btn"
                    data-category="All">

                    All

                </button>


                <button
                    class="btn btn-outline-primary me-2 mb-2 category-btn"
                    data-category="Java">

                    Java

                </button>


                <button
                    class="btn btn-outline-primary me-2 mb-2 category-btn"
                    data-category="SQL">

                    SQL

                </button>


                <button
                    class="btn btn-outline-primary me-2 mb-2 category-btn"
                    data-category="Web Development">

                    Web Development

                </button>


                <button
                    class="btn btn-outline-primary me-2 mb-2 category-btn"
                    data-category="DSA">

                    DSA

                </button>


                <button
                    class="btn btn-outline-primary me-2 mb-2 category-btn"
                    data-category="Aptitude">

                    Aptitude

                </button>


                <button
                    class="btn btn-outline-primary me-2 mb-2 category-btn"
                    data-category="AI/ML">

                    AI / ML

                </button>

            </div>



            <!-- RESOURCES -->

            <div class="row g-4"
                 id="resourcesContainer">

            </div>


        </main>

    </div>

</div>



<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script src="../js/resources.js"></script>


</body>

</html>
