<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Campus | Schedule</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold"
           href="../index.html">

            🌱 Smart Campus

        </a>


        <div class="d-flex align-items-center">

            <button
                class="btn btn-outline-secondary me-3"
                id="themeToggle">

                <i class="bi bi-moon"></i>

            </button>


            <span class="fw-semibold">
                Hema 👋
            </span>

        </div>

    </div>

</nav>



<!-- =========================
     PAGE
========================= -->

<div class="container-fluid">

    <div class="row">


        <!-- SIDEBAR -->

        <aside class="col-md-3 col-lg-2 sidebar p-3">

            <h6 class="text-uppercase text-muted">
                Menu
            </h6>


            <ul class="nav flex-column">


                <li class="nav-item">

                    <a class="nav-link"
                       href="../index.html">

                        <i class="bi bi-grid"></i>

                        Dashboard

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       href="tasks.html">

                        <i class="bi bi-check2-square"></i>

                        Tasks

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       href="notes.html">

                        <i class="bi bi-journal-text"></i>

                        Notes

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link active"
                       href="schedule.html">

                        <i class="bi bi-calendar3"></i>

                        Schedule

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       href="timer.html">

                        <i class="bi bi-stopwatch"></i>

                        Study Timer

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       href="resources.html">

                        <i class="bi bi-book"></i>

                        Resources

                    </a>

                </li>

            </ul>

        </aside>



        <!-- =========================
             MAIN CONTENT
        ========================== -->

        <main class="col-md-9 col-lg-10 p-4">


            <!-- HEADER -->

            <div class="d-flex
                        justify-content-between
                        align-items-center
                        mb-4">

                <div>

                    <h2>
                        My Schedule
                    </h2>

                    <p class="text-muted">

                        Organize your classes and study sessions.

                    </p>

                </div>


                <button
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#scheduleModal"
                    onclick="prepareAddSchedule()">

                    <i class="bi bi-plus-lg"></i>

                    Add Session

                </button>

            </div>



            <!-- DAY FILTER -->

            <div class="card mb-4">

                <div class="card-body">

                    <div class="row align-items-center">

                        <div class="col-md-4">

                            <label class="form-label fw-semibold">

                                Select Day

                            </label>


                            <select
                                id="dayFilter"
                                class="form-select">

                                <option value="All">
                                    All Days
                                </option>

                                <option value="Monday">
                                    Monday
                                </option>

                                <option value="Tuesday">
                                    Tuesday
                                </option>

                                <option value="Wednesday">
                                    Wednesday
                                </option>

                                <option value="Thursday">
                                    Thursday
                                </option>

                                <option value="Friday">
                                    Friday
                                </option>

                                <option value="Saturday">
                                    Saturday
                                </option>

                            </select>

                        </div>


                        <div class="col-md-8 mt-3 mt-md-0">

                            <div class="alert alert-info mb-0">

                                <i class="bi bi-info-circle"></i>

                                Add your classes, labs, and study
                                sessions to organize your week.

                            </div>

                        </div>

                    </div>

                </div>

            </div>



            <!-- SCHEDULE CONTAINER -->

            <div id="scheduleContainer">

            </div>


        </main>

    </div>

</div>



<!-- =========================
     ADD SCHEDULE MODAL
========================= -->

<div class="modal fade"
     id="scheduleModal"
     tabindex="-1">


    <div class="modal-dialog">

        <div class="modal-content">


            <div class="modal-header">

                <h5 class="modal-title"
                    id="scheduleModalTitle">

                    Add Study Session

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>



            <div class="modal-body">


                <form id="scheduleForm">


                    <!-- SUBJECT -->

                    <div class="mb-3">

                        <label class="form-label">

                            Subject

                        </label>


                        <input
                            type="text"
                            id="subject"
                            class="form-control"
                            placeholder="Example: Java Programming"
                            required>

                    </div>



                    <!-- DAY -->

                    <div class="mb-3">

                        <label class="form-label">

                            Day

                        </label>


                        <select
                            id="scheduleDay"
                            class="form-select"
                            required>

                            <option value="">
                                Select Day
                            </option>

                            <option>
                                Monday
                            </option>

                            <option>
                                Tuesday
                            </option>

                            <option>
                                Wednesday
                            </option>

                            <option>
                                Thursday
                            </option>

                            <option>
                                Friday
                            </option>

                            <option>
                                Saturday
                            </option>

                        </select>

                    </div>



                    <!-- TIME -->

                    <div class="mb-3">

                        <label class="form-label">

                            Time

                        </label>


                        <input
                            type="time"
                            id="scheduleTime"
                            class="form-control"
                            required>

                    </div>



                    <!-- INSTRUCTOR -->

                    <div class="mb-3">

                        <label class="form-label">

                            Instructor

                        </label>


                        <input
                            type="text"
                            id="instructor"
                            class="form-control"
                            placeholder="Example: Dr. Kumar">

                    </div>



                    <!-- ROOM -->

                    <div class="mb-3">

                        <label class="form-label">

                            Room / Lab

                        </label>


                        <input
                            type="text"
                            id="room"
                            class="form-control"
                            placeholder="Example: Lab 2">

                    </div>



                    <!-- TYPE -->

                    <div class="mb-3">

                        <label class="form-label">

                            Session Type

                        </label>


                        <select
                            id="sessionType"
                            class="form-select">

                            <option>
                                Class
                            </option>

                            <option>
                                Lab
                            </option>

                            <option>
                                Study
                            </option>

                            <option>
                                Exam
                            </option>

                            <option>
                                Other
                            </option>

                        </select>

                    </div>



                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Save Session

                    </button>


                </form>

            </div>

        </div>

    </div>

</div>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Schedule JS -->

<script src="../js/schedule.js"></script>


</body>

</html>
