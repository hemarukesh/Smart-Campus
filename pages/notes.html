<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Campus | Notes</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container-fluid">

            <a class="navbar-brand fw-bold"
               href="../index.html">

                🌱 Smart Campus

            </a>


            <div class="d-flex align-items-center">

                <button
                    class="btn btn-outline-secondary me-3"
                    id="themeToggle">

                    <i class="bi bi-moon"></i>

                </button>


                <span class="fw-semibold">
                    Hema 👋
                </span>

            </div>

        </div>

    </nav>



    <!-- PAGE -->

    <div class="container-fluid">

        <div class="row">


            <!-- SIDEBAR -->

            <aside class="col-md-3 col-lg-2 sidebar p-3">

                <h6 class="text-uppercase text-muted">
                    Menu
                </h6>


                <ul class="nav flex-column">


                    <li class="nav-item">

                        <a class="nav-link"
                           href="../index.html">

                            <i class="bi bi-grid"></i>

                            Dashboard

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link"
                           href="tasks.html">

                            <i class="bi bi-check2-square"></i>

                            Tasks

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link active"
                           href="notes.html">

                            <i class="bi bi-journal-text"></i>

                            Notes

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link"
                           href="schedule.html">

                            <i class="bi bi-calendar3"></i>

                            Schedule

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link"
                           href="timer.html">

                            <i class="bi bi-stopwatch"></i>

                            Study Timer

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link"
                           href="resources.html">

                            <i class="bi bi-book"></i>

                            Resources

                        </a>

                    </li>

                </ul>

            </aside>



            <!-- MAIN CONTENT -->

            <main class="col-md-9 col-lg-10 p-4">


                <!-- HEADER -->

                <div class="d-flex
                            justify-content-between
                            align-items-center
                            mb-4">

                    <div>

                        <h2>
                            My Notes
                        </h2>

                        <p class="text-muted">

                            Organize your study notes in one place.

                        </p>

                    </div>


                    <button
                        class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#noteModal"
                        onclick="prepareAddNote()">

                        <i class="bi bi-plus-lg"></i>

                        New Note

                    </button>

                </div>



                <!-- SEARCH + FILTER -->

                <div class="card mb-4">

                    <div class="card-body">

                        <div class="row g-3">


                            <div class="col-md-8">

                                <div class="input-group">

                                    <span class="input-group-text">

                                        <i class="bi bi-search"></i>

                                    </span>


                                    <input
                                        type="text"
                                        id="searchNote"
                                        class="form-control"
                                        placeholder="Search notes...">

                                </div>

                            </div>


                            <div class="col-md-4">

                                <select
                                    id="filterCategory"
                                    class="form-select">

                                    <option value="all">
                                        All Categories
                                    </option>

                                    <option value="Java">
                                        Java
                                    </option>

                                    <option value="SQL">
                                        SQL
                                    </option>

                                    <option value="Web Development">
                                        Web Development
                                    </option>

                                    <option value="DSA">
                                        DSA
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>

                </div>



                <!-- NOTES -->

                <div class="row g-4"
                     id="notesContainer">

                </div>


            </main>

        </div>

    </div>



    <!-- NOTE MODAL -->

    <div class="modal fade"
         id="noteModal"
         tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">


                <div class="modal-header">

                    <h5 class="modal-title"
                        id="noteModalTitle">

                        Create New Note

                    </h5>


                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>



                <div class="modal-body">

                    <form id="noteForm">


                        <!-- NOTE TITLE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Note Title
                            </label>

                            <input
                                type="text"
                                id="noteTitle"
                                class="form-control"
                                placeholder="Enter note title"
                                required>

                        </div>



                        <!-- CATEGORY -->

                        <div class="mb-3">

                            <label class="form-label">
                                Category
                            </label>

                            <select
                                id="noteCategory"
                                class="form-select">

                                <option value="Java">
                                    Java
                                </option>

                                <option value="SQL">
                                    SQL
                                </option>

                                <option value="Web Development">
                                    Web Development
                                </option>

                                <option value="DSA">
                                    DSA
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>



                        <!-- CONTENT -->

                        <div class="mb-3">

                            <label class="form-label">
                                Note Content
                            </label>

                            <textarea
                                id="noteContent"
                                class="form-control"
                                rows="8"
                                placeholder="Write your notes here..."
                                required>
                            </textarea>

                        </div>



                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Save Note

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>



    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Notes JS -->

    <script src="../js/notes.js"></script>

</body>

</html>
