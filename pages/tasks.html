<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Campus | Tasks</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container-fluid">

            <a class="navbar-brand fw-bold"
               href="../index.html">

                🌱 Smart Campus

            </a>

            <div class="d-flex align-items-center">

                <button class="btn btn-outline-secondary me-3"
                        id="themeToggle">

                    <i class="bi bi-moon"></i>

                </button>

                <span class="fw-semibold">
                    Hema 👋
                </span>

            </div>

        </div>

    </nav>


    <div class="container-fluid">

        <div class="row">


            <!-- SIDEBAR -->

            <aside class="col-md-3 col-lg-2 sidebar p-3">

                <h6 class="text-uppercase text-muted">
                    Menu
                </h6>

                <ul class="nav flex-column">

                    <li class="nav-item">

                        <a class="nav-link"
                           href="../index.html">

                            <i class="bi bi-grid"></i>
                            Dashboard

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link active"
                           href="tasks.html">

                            <i class="bi bi-check2-square"></i>
                            Tasks

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link"
                           href="notes.html">

                            <i class="bi bi-journal-text"></i>
                            Notes

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link"
                           href="schedule.html">

                            <i class="bi bi-calendar3"></i>
                            Schedule

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link"
                           href="timer.html">

                            <i class="bi bi-stopwatch"></i>
                            Study Timer

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link"
                           href="resources.html">

                            <i class="bi bi-book"></i>
                            Resources

                        </a>

                    </li>

                </ul>

            </aside>


            <!-- MAIN CONTENT -->

            <main class="col-md-9 col-lg-10 p-4">


                <!-- PAGE HEADER -->

                <div class="d-flex
                            justify-content-between
                            align-items-center
                            mb-4">

                    <div>

                        <h2>
                            My Tasks
                        </h2>

                        <p class="text-muted">
                            Manage your academic tasks and stay productive.
                        </p>

                    </div>


                    <button class="btn btn-primary"
                            data-bs-toggle="modal"
                            data-bs-target="#taskModal">

                        <i class="bi bi-plus-lg"></i>

                        Add Task

                    </button>

                </div>


                <!-- FILTER -->

                <div class="card mb-4">

                    <div class="card-body">

                        <div class="row g-3">

                            <div class="col-md-6">

                                <input
                                    type="text"
                                    id="searchTask"
                                    class="form-control"
                                    placeholder="🔍 Search tasks...">

                            </div>


                            <div class="col-md-3">

                                <select
                                    id="filterPriority"
                                    class="form-select">

                                    <option value="all">
                                        All Priorities
                                    </option>

                                    <option value="High">
                                        High
                                    </option>

                                    <option value="Medium">
                                        Medium
                                    </option>

                                    <option value="Low">
                                        Low
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-3">

                                <select
                                    id="filterStatus"
                                    class="form-select">

                                    <option value="all">
                                        All Tasks
                                    </option>

                                    <option value="pending">
                                        Pending
                                    </option>

                                    <option value="completed">
                                        Completed
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- TASK LIST -->

                <div class="card">

                    <div class="card-header bg-white">

                        <h5 class="mb-0">
                            Task List
                        </h5>

                    </div>


                    <div class="card-body">

                        <div id="taskList">

                            <div class="text-center text-muted py-5">

                                <i class="bi bi-clipboard-x fs-1">
                                </i>

                                <p class="mt-2">
                                    No tasks available.
                                </p>

                            </div>

                        </div>

                    </div>

                </div>


            </main>

        </div>

    </div>


    <!-- ADD TASK MODAL -->

    <div class="modal fade"
         id="taskModal"
         tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">


                <div class="modal-header">

                    <h5 class="modal-title">
                        Add New Task
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">

                    <form id="taskForm">


                        <!-- TASK TITLE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Task Title
                            </label>

                            <input
                                type="text"
                                id="taskTitle"
                                class="form-control"
                                placeholder="Enter task title"
                                required>

                        </div>


                        <!-- DUE DATE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Due Date
                            </label>

                            <input
                                type="date"
                                id="taskDate"
                                class="form-control"
                                required>

                        </div>


                        <!-- PRIORITY -->

                        <div class="mb-3">

                            <label class="form-label">
                                Priority
                            </label>

                            <select
                                id="taskPriority"
                                class="form-select">

                                <option value="High">
                                    High
                                </option>

                                <option value="Medium"
                                        selected>

                                    Medium

                                </option>

                                <option value="Low">
                                    Low
                                </option>

                            </select>

                        </div>


                        <!-- CATEGORY -->

                        <div class="mb-3">

                            <label class="form-label">
                                Category
                            </label>

                            <select
                                id="taskCategory"
                                class="form-select">

                                <option>
                                    Academic
                                </option>

                                <option>
                                    Assignment
                                </option>

                                <option>
                                    Exam
                                </option>

                                <option>
                                    Personal
                                </option>

                            </select>

                        </div>


                        <button type="submit"
                                class="btn btn-primary w-100">

                            Add Task

                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Task JavaScript -->

    <script src="../js/tasks.js"></script>

</body>

</html>
